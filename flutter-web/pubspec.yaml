name: docketwatch_web
description: DocketWatch - Court Case Monitoring & AI Legal Document Summarization
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.4.0

  # Data models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # UI Components
  data_table_2: ^2.5.0
  file_picker: ^8.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.0

  # Utilities
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - web/
