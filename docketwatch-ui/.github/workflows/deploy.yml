name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build web --release --web-renderer canvaskit

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/

  deploy:
    name: Deploy SPA to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/

      - name: Deploy to S3
        run: |
          # Static assets with long cache
          aws s3 sync build/web/ s3://docketwatch-production-spa/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "flutter_service_worker.js"

          # index.html and service worker - no cache
          aws s3 cp build/web/index.html s3://docketwatch-production-spa/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp build/web/flutter_service_worker.js s3://docketwatch-production-spa/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/flutter_service_worker.js" "/version.json"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check SPA loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://docketwatch.tmz.tv/)
          if [ "$STATUS" != "200" ]; then
            echo "SPA failed to load: $STATUS"
            exit 1
          fi
          echo "SPA health check passed"
